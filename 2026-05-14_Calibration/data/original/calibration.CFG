; FEMBUN configuration file of default settings.

; Image coordinate observation default standard deviations.
;
IMGX = 2   ; x coordinate
IMGY = 2  ; y coordinate
;
;  Default maximum number of iterations.
 ;
ITER=20
;
;  Default decimal place precision in output file
;
PREC = 4;
;
;  Default convergence criteria
;
TOL = 0.001  1.0e-5  0.001  1.0e-9 ;
;
;  Default data snooping value.
;
DSNOOP = 0.001 0.20
;
ALPHA = 0.05
; A priori standard deviation of double difference principal distance
; constraints (FEM model only)
F_SD = 0.01
;
; number of finite elements (FEM model only)
NUM_ELEM = 4
;
; Additional parameters to be used/estimated
PARAMS = K1 K2 K3
;
; Number of histogram classes for goodness-of-fit test
NUM_CLASS= 16
;
; Range camera modulation frequency in MHz
MOD_FREQ=30
;
; Offset vector of the GPS antenna from the perspective centre in object
; space units
ANT_OS =  0 0 0


